<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write to Tasks - AI Agent Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        button.secondary:hover {
            background: #efefef;
            border-color: #667eea;
            color: #667eea;
        }

        button.success {
            background: #48bb78;
        }

        button.success:hover {
            background: #38a169;
        }

        button.danger {
            background: #f56565;
        }

        button.danger:hover {
            background: #e53e3e;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .status-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }

        .status-message.success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #48bb78;
        }

        .status-message.error {
            background: #fed7d7;
            color: #742a2a;
            border-left: 4px solid #f56565;
        }

        .status-message.info {
            background: #bee3f8;
            color: #2c5282;
            border-left: 4px solid #4299e1;
        }

        .status-message.show {
            display: block;
        }

        .list-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .list-item-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .list-item-desc {
            color: #666;
            font-size: 0.9em;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px 0;
        }

        .empty-state-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
            margin-right: 5px;
        }

        .badge.pending {
            background: #ed8936;
        }

        .badge.completed {
            background: #48bb78;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .refresh-button {
            padding: 6px 12px;
            font-size: 0.9em;
        }

        .full-width {
            width: 100%;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Write to Tasks</h1>
            <p>AI-powered task management with Google Tasks integration</p>
        </header>

        <div class="grid">
            <!-- Configuration Settings Section -->
            <div class="card">
                <h2>⚙️ Settings</h2>
                <div id="settingsStatus" class="status-message"></div>
                
                <div class="form-group">
                    <label for="fileToCheck">File Path to Monitor</label>
                    <input type="text" id="fileToCheck" placeholder="e.g., C:\path\to\file.txt">
                    <small style="color: #999; margin-top: 4px; display: block;">The file to watch for changes</small>
                </div>

                <div class="form-group">
                    <label for="taskListId">Google Tasks List ID</label>
                    <input type="text" id="taskListId" placeholder="@default" value="@default">
                    <small style="color: #999; margin-top: 4px; display: block;">Task list to add new tasks to (default: @default)</small>
                </div>

                <div class="form-group">
                    <label for="apiKey">Google API Key</label>
                    <input type="password" id="apiKey" placeholder="Paste your Google API key here">
                    <small style="color: #999; margin-top: 4px; display: block;">Your Google API authentication token</small>
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="disableFileMonitoring" style="width: auto; cursor: pointer;">
                        <span>Disable File Monitoring</span>
                    </label>
                    <small style="color: #999; margin-top: 4px; display: block;">Uncheck to enable automatic file tracking</small>
                </div>

                <button class="full-width" onclick="saveSettings()">Save Settings</button>
            </div>

            <!-- Generate Content Section -->
            <div class="card">
                <h2>✨ Generate Task</h2>
                <div id="generateStatus" class="status-message"></div>
                
                <div class="form-group">
                    <label for="promptInput">Enter Your Prompt</label>
                    <textarea id="promptInput" placeholder="Describe the task you want to add to your list..."></textarea>
                </div>

                <button class="full-width" onclick="generateContent()" id="generateBtn">Generate Task</button>
            </div>
        </div>

        <div class="grid">
            <!-- Current Tasks Section -->
            <div class="card">
                <h2>📋 Your Tasks</h2>
                <div class="button-group" style="margin-bottom: 20px;">
                    <button class="refresh-button secondary" onclick="refreshTasks()">🔄 Refresh</button>
                </div>
                <div id="tasksList"></div>
            </div>

            <!-- Pending Batches Section -->
            <div class="card">
                <h2>⏳ Pending Approval</h2>
                <div class="button-group" style="margin-bottom: 20px;">
                    <button class="refresh-button secondary" onclick="refreshPending()">🔄 Refresh</button>
                    <button class="refresh-button danger" onclick="clearAllPending()">Clear All</button>
                </div>
                <div id="pendingList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        
        // Track which fields have been modified by the user
        let modifiedFields = new Set();
        let loadedSettings = {};

        // Status message helper
        function showStatus(elementId, message, type = 'info') {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = `status-message show ${type}`;
            setTimeout(() => {
                el.classList.remove('show');
            }, 4000);
        }

        // Attach change listeners to track modifications
        function attachChangeListeners() {
            document.getElementById('fileToCheck').addEventListener('input', () => modifiedFields.add('fileToCheck'));
            document.getElementById('taskListId').addEventListener('input', () => modifiedFields.add('taskListId'));
            document.getElementById('apiKey').addEventListener('input', () => modifiedFields.add('apiKey'));
            document.getElementById('disableFileMonitoring').addEventListener('change', () => modifiedFields.add('disableFileMonitoring'));
        }

        // Load settings on page load
        function loadSettings() {
            fetch(`${API_BASE}/config`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('fileToCheck').value = data.file_to_check || '';
                    document.getElementById('taskListId').value = data.tasklist_id || '@default';
                    document.getElementById('apiKey').value = data.google_api_token ? '••••••••' : '';
                    document.getElementById('disableFileMonitoring').checked = !data.file_tracker_set;
                    
                    // Store loaded state for comparison
                    loadedSettings = {
                        fileToCheck: document.getElementById('fileToCheck').value,
                        taskListId: document.getElementById('taskListId').value,
                        apiKey: document.getElementById('apiKey').value,
                        disableFileMonitoring: document.getElementById('disableFileMonitoring').checked
                    };
                    
                    // Clear modification tracking after loading
                    modifiedFields.clear();
                    attachChangeListeners();
                })
                .catch(err => console.error('Error loading settings:', err));
        }

        // Save settings - only send fields that were modified
        function saveSettings() {
            const fileToCheck = document.getElementById('fileToCheck').value.trim();
            const taskListId = document.getElementById('taskListId').value.trim() || '@default';
            const apiKey = document.getElementById('apiKey').value.trim();
            const disableFileMonitoring = document.getElementById('disableFileMonitoring').checked;

            const payload = {};
            
            // Only include fields that were actually modified by the user
            if (modifiedFields.has('fileToCheck')) {
                payload.file_to_check = fileToCheck || null;
            }
            if (modifiedFields.has('taskListId')) {
                payload.tasklist_id = taskListId;
            }
            // For API key: only send if modified AND it's not the masked placeholder
            if (modifiedFields.has('apiKey') && apiKey !== '••••••••' && apiKey !== '') {
                payload.google_api_token = apiKey;
            }
            if (modifiedFields.has('disableFileMonitoring')) {
                payload.file_tracker_enabled = !disableFileMonitoring;
            }
            
            // If nothing was modified, show message
            if (Object.keys(payload).length === 0) {
                showStatus('settingsStatus', 'No changes to save', 'info');
                return;
            }

            fetch(`${API_BASE}/config`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        showStatus('settingsStatus', `Error: ${data.error}`, 'error');
                    } else {
                        showStatus('settingsStatus', 'Settings saved successfully!', 'success');
                        loadSettings();
                    }
                })
                .catch(err => {
                    showStatus('settingsStatus', `Error: ${err.message}`, 'error');
                });
        }

        // Generate content
        function generateContent() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                showStatus('generateStatus', 'Please enter a prompt', 'error');
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Generating...';

            fetch(`${API_BASE}/generate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            })
                .then(r => r.json())
                .then(data => {
                    btn.disabled = false;
                    btn.innerHTML = 'Generate Task';

                    if (data.error) {
                        showStatus('generateStatus', `Error: ${data.error}`, 'error');
                    } else {
                        showStatus('generateStatus', 'Task generated! Check pending approval.', 'success');
                        document.getElementById('promptInput').value = '';
                        refreshPending();
                    }
                })
                .catch(err => {
                    btn.disabled = false;
                    btn.innerHTML = 'Generate Task';
                    showStatus('generateStatus', `Error: ${err.message}`, 'error');
                });
        }

        // Refresh tasks list
        function refreshTasks() {
            fetch(`${API_BASE}/tasks`)
                .then(r => r.json())
                .then(data => {
                    const list = document.getElementById('tasksList');
                    const tasks = data.tasks || [];

                    if (!tasks.length) {
                        list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>No tasks yet</p></div>';
                    } else {
                        list.innerHTML = tasks.map((task, idx) => {
                            const title = task.title || 'Untitled';
                            const notes = task.notes || '';
                            return `
                                <div class="list-item">
                                    <div class="list-item-title">✅ ${title}</div>
                                    ${notes ? `<div class="list-item-desc">${notes}</div>` : ''}
                                </div>
                            `;
                        }).join('');
                    }
                })
                .catch(err => {
                    document.getElementById('tasksList').innerHTML = `<div class="empty-state"><p style="color: red;">Error loading tasks</p></div>`;
                });
        }

        // Refresh pending batches
        function refreshPending() {
            fetch(`${API_BASE}/pending`)
                .then(r => r.json())
                .then(data => {
                    const list = document.getElementById('pendingList');
                    const batches = data.pending_batches || [];

                    if (!batches.length) {
                        list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✨</div><p>No pending approvals</p></div>';
                    } else {
                        list.innerHTML = batches.map((batch, idx) => `
                            <div class="list-item">
                                <div class="list-item-title">
                                    <span class="badge pending">ID: ${batch.id}</span>
                                    ${batch.description || 'Task Batch'}
                                </div>
                                <div class="list-item-desc">${batch.details || 'No details provided'}</div>
                                <div class="button-group" style="margin-top: 12px;">
                                    <button class="success" style="flex: 1;" onclick="approveBatch(${batch.id})">Approve</button>
                                    <button class="danger" style="flex: 1;" onclick="denyBatch(${batch.id})">Deny</button>
                                </div>
                            </div>
                        `).join('');
                    }
                })
                .catch(err => {
                    document.getElementById('pendingList').innerHTML = `<div class="empty-state"><p style="color: red;">Error loading pending tasks</p></div>`;
                });
        }

        // Approve batch
        function approveBatch(batchId) {
            fetch(`${API_BASE}/action/approve?task_id=${batchId}`, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    showStatus('settingsStatus', `Batch ${batchId} approved!`, 'success');
                    refreshPending();
                    refreshTasks();
                })
                .catch(err => showStatus('settingsStatus', `Error approving batch: ${err.message}`, 'error'));
        }

        // Deny batch
        function denyBatch(batchId) {
            fetch(`${API_BASE}/action/deny?task_id=${batchId}`, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    showStatus('settingsStatus', `Batch ${batchId} denied!`, 'success');
                    refreshPending();
                })
                .catch(err => showStatus('settingsStatus', `Error denying batch: ${err.message}`, 'error'));
        }

        // Clear all pending
        function clearAllPending() {
            if (confirm('Are you sure you want to clear all pending batches? This cannot be undone.')) {
                fetch(`${API_BASE}/action/clear`, { method: 'POST' })
                    .then(r => r.json())
                    .then(data => {
                        showStatus('settingsStatus', 'All pending batches cleared!', 'success');
                        refreshPending();
                    })
                    .catch(err => showStatus('settingsStatus', `Error clearing batches: ${err.message}`, 'error'));
            }
        }

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            refreshTasks();
            refreshPending();
        });
    </script>
</body>
</html>
